<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .navy { fill: #001F3F; }
      .navy-stroke { stroke: #001F3F; stroke-width: 12; stroke-linecap: round; }
      .text { font-family: 'Arial Black', 'Impact', sans-serif; font-weight: 900; fill: #001F3F; letter-spacing: 14px; }
    </style>
  </defs>

  <!-- Gear Outer Teeth -->
  <g class="navy">
    <!-- Tooth 1 Top -->
    <path d="M220 50 L280 50 L270 95 L230 95 Z" />
    <!-- Tooth 2 Top Right -->
    <path d="M340 85 L385 125 L350 160 L310 130 Z" />
    <!-- Tooth 3 Right -->
    <path d="M405 190 L425 250 L380 250 L370 205 Z" />
    <!-- Tooth 4 Bottom Right -->
    <path d="M385 315 L345 355 L310 320 L345 285 Z" />
    <!-- Tooth 5 Bottom Left -->
    <path d="M155 355 L115 315 L155 285 L190 320 Z" />
    <!-- Tooth 6 Left -->
    <path d="M75 250 L95 190 L130 205 L120 250 Z" />
    <!-- Tooth 7 Top Left -->
    <path d="M115 125 L160 85 L190 130 L150 160 Z" />

    <!-- Main Outer Ring -->
    <circle cx="250" cy="205" r="145" />
  </g>

  <!-- Inner White Hole cutout -->
  <circle cx="250" cy="205" r="105" fill="#FFFFFF" />

  <!-- Inner Navy Ring for wrench cutout -->
  <circle cx="250" cy="205" r="95" class="navy" />
  <circle cx="250" cy="205" r="65" fill="#FFFFFF" />

  <!-- Wrench Shape overlay -->
  <g class="navy">
    <!-- Wrench handle -->
    <rect x="236" y="200" width="28" height="120" rx="4" />
    <rect x="240" y="270" width="20" height="50" rx="2" fill="#FFFFFF" />
    <rect x="244" y="275" width="12" height="40" rx="1" class="navy" />
    <!-- Wrench head -->
    <circle cx="250" cy="180" r="48" />
  </g>
  
  <!-- Wrench Inner Cutout (Open End) -->
  <path d="M225 130 L275 130 L268 185 L232 185 Z" fill="#FFFFFF" />

  <!-- Text C.N.P -->
  <text x="260" y="420" text-anchor="middle" font-size="76" class="text">C.N.P</text>

  <!-- Underlines -->
  <line x1="70" y1="445" x2="200" y2="445" class="navy-stroke" />
  <line x1="300" y1="445" x2="430" y2="445" class="navy-stroke" />
</svg>
